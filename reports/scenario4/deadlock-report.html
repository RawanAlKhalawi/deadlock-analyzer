<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Deadlock Analysis Report</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
    h1 { color: #333; }
    h2 { color: #555; margin-top: 30px; }
    table { border-collapse: collapse; width: 100%; margin: 20px 0; background-color: white; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
    th { background-color: #4CAF50; color: white; }
    tr:nth-child(even) { background-color: #f2f2f2; }
    .deadlock-cycle { color: #d32f2f; font-weight: bold; }
    .suggested-fix { color: #388e3c; font-weight: bold; background-color: #e8f5e9; padding: 10px; border-radius: 5px; margin: 10px 0; }
    .conflict-description { background-color: #fff3e0; padding: 10px; border-left: 4px solid #ff9800; margin: 10px 0; }
    .cycle-details { background-color: #ffebee; padding: 15px; border-radius: 5px; margin: 10px 0; }
    .statement { margin: 5px 0; padding: 5px; background-color: white; border-left: 3px solid #d32f2f; }
    .summary { background-color: #e3f2fd; padding: 15px; border-radius: 5px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>Deadlock Analysis Report</h1>
  <div class="summary">
    <p><strong>Generated:</strong> 2026-02-19 00:40:30</p>
    <p><strong>Total Deadlocks Found:</strong> 0</p>
  </div>
  <p>No deadlocks detected.</p>
</body>
</html>
